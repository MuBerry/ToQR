# fnos-qrcode 容器内的 nginx 配置
#
# 同时支持两种访问入口，不用改任何东西：
#   1) 根路径：  http://<主机>/
#      —— 给「下级域名」用的。反代把 qrcode.example.com 指到本容器 80 端口即可，
#         访客在地址栏看到的就是干净的子域名，不会多出一层路径。
#   2) 子路径：  http://<主机>/fnos-qrcode/
#      —— 给「加飞牛链接后缀」用的，直接拼在 IP:端口 后面就能访问。
#
# 页面文件只有一个：/usr/share/nginx/html/fnos-qrcode/index.html
# （由 docker-compose.yml 把同级的 html/ 目录挂进去）

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    charset utf-8;

    # 页面本身禁止强缓存，覆盖更新 index.html 后强制刷新即可生效
    add_header Cache-Control "no-cache";

    # ---- 入口 1：根路径（下级域名反代走这里）----
    location = / {
        default_type text/html;
        try_files /fnos-qrcode/index.html =404;
    }

    location = /index.html {
        default_type text/html;
        try_files /fnos-qrcode/index.html =404;
    }

    # ---- 入口 2：子路径（IP:端口/fnos-qrcode/）----
    location /fnos-qrcode/ {
        try_files $uri $uri/ /fnos-qrcode/index.html;
    }

    # 其余路径一律 404，避免出现目录列表
    location / {
        return 404;
    }
}
