# 方案 B 备选：已经有自己的 nginx 时，直接把下面片段加进去
#
# 用之前先把路径改成你的实际路径，例如：
#   /vol1/1000/docker/fnos-qrcode/html
# 改完执行：nginx -t && nginx -s reload
#
# 注意：本文件只是片段参考，不要整个丢进 conf.d/（里面有两个 server 块会冲突，
# 按需复制其中一个即可）。

# ============================================================
# 写法一：下级域名整站（推荐）
#   访问 https://qrcode.example.com/
# ============================================================
server {
    listen      80;
    server_name qrcode.example.com;          # 换成你的下级域名

    root  /vol1/1000/docker/fnos-qrcode/html;
    charset utf-8;

    add_header Cache-Control "no-cache";

    # 根路径直接出应用
    location = / {
        default_type text/html;
        try_files /fnos-qrcode/index.html =404;
    }

    # 子路径同样可访问：/fnos-qrcode/
    location /fnos-qrcode/ {
        try_files $uri $uri/ /fnos-qrcode/index.html;
    }

    location / { return 404; }
}

# ============================================================
# 写法二：挂在已有站点的子路径下
