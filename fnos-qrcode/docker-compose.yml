# 飞牛 fnOS 部署：二维码批量生成器
#
# 用法：飞牛桌面 →「容器管理」→「项目」→「创建项目」
#       项目名称填 fnos-qrcode，项目路径选到本目录（fnos-qrcode/），把本文件内容粘进去，构建。
#
# 构建完成后两种访问方式都可用：
#   路径访问：http://<飞牛IP>:12990/fnos-qrcode/
#   根路径  ：http://<飞牛IP>:12990/              （配合下级域名反代使用）
#
# 端口冲突就把 "12990:80" 左边的 12990 改成别的空闲端口（社区常用 5xxx/8xxx，避开飞牛自身占用的 5666、8000、16601 等）。

services:
  fnos-qrcode:
    image: nginx:alpine
    container_name: fnos-qrcode
    ports:
      - "12990:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
